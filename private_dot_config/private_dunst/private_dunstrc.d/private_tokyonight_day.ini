# TokyoNight colors for dunst
# For more configuration options see https://github.com/dunst-project/dunst/blob/master/dunstrc

[urgency_low]
    background = "#d0d5e3"
    foreground = "#3760bf"
    frame_color = "#3760bf"
    highlight = "#722ae6, #e4b5cb"

[urgency_normal]
    background = "#e1e2e7"
    foreground = "#3760bf"
    frame_color = "#3760bf"
    highlight = "#722ae6, #e4b5cb"

[urgency_critical]
    background = "#c4c8da"
    foreground = "#c64343"
    frame_color = "#c64343"
    highlight = "#d54e53, #c64343"
