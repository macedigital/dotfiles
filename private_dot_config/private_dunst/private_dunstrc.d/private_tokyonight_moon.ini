# TokyoNight colors for dunst
# For more configuration options see https://github.com/dunst-project/dunst/blob/master/dunstrc

[urgency_low]
    background = "#1e2030"
    foreground = "#c8d3f5"
    frame_color = "#c8d3f5"
    highlight = "#722ae6, #e4b5cb"

[urgency_normal]
    background = "#222436"
    foreground = "#c8d3f5"
    frame_color = "#c8d3f5"
    highlight = "#722ae6, #e4b5cb"

[urgency_critical]
    background = "#2f334d"
    foreground = "#c53b53"
    frame_color = "#c53b53"
    highlight = "#d54e53, #c53b53"
